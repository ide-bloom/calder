version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories:
      - "/native/uirecorder"
      - "/tests/vendorapp"
    schedule:
      interval: weekly
  - package-ecosystem: vcpkg
    directory: "/native"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
